<!DOCTYPE html>
<html>
<head>
    <title>Hospital Appointment</title>
</head>
<body>

    <h1>City Care Hospital</h1>
    <p>Your Health, Our Priority</p>

    <hr>

    <h2>Book an Appointment</h2>

    <form>
        <label>Patient Name:</label><br>
        <input type="text" required><br><br>

        <label>Email:</label><br>
        <input type="email" required><br><br>

        <label>Phone:</label><br>
        <input type="tel" required><br><br>

        <label>Select Doctor:</label><br>
        <select>
            <option>Dr. Sharma - Cardiologist</option>
            <option>Dr. Priya - Dentist</option>
            <option>Dr. Kumar - Neurologist</option>
            <option>Dr. Anil - General Physician</option>
        </select><br><br>

        <label>Appointment Date:</label><br>
        <input type="date" required><br><br>

        <label>Message:</label><br>
        <textarea rows="4" cols="30"></textarea><br><br>

        <button type="submit">Book Appointment</button>
        <button type="reset">Clear</button>
    </form>

    <hr>

    <h2>Departments</h2>

    <ul>
        <li>Cardiology</li>
        <li>Neurology</li>
        <li>Dentistry</li>
        <li>General Medicine</li>
        <li>Orthopedics</li>
    </ul>

    <h2>Contact</h2>

    <p>Phone: 9876543210</p>
    <p>Email: citycare@example.com</p>
    <p>Address: Main Road, City</p>

    <hr>

    <p>© 2026 City Care Hospital</p>

</body>
</html>
